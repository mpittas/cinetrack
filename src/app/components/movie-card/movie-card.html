<div class="movie-card-wrapper">
  <a [routerLink]="['/movie', movie().id]" class="movie-card-inner" [attr.aria-label]="movie().title">
    <div class="poster-container">
      <img
        [src]="posterUrl"
        [alt]="movie().title"
        loading="lazy"
        class="poster-img"
        (error)="onImgError($event)"
      />
      <div class="poster-sheen"></div>

      <div class="rating-chip">
        <svg viewBox="0 0 24 24" fill="currentColor" class="star-icon">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>{{ ratingFormatted }}</span>
      </div>

      @if (watchlistService.isWatched(movie().id)) {
        <div class="status-indicator-chip watched" title="Watched">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="status-icon">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      } @else if (watchlistService.isInWatchlist(movie().id)) {
        <div class="status-indicator-chip" title="In your watchlist">
          <svg viewBox="0 0 24 24" fill="currentColor" class="status-icon">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
      }

      <div class="card-hover-actions">
        <button
          type="button"
          class="card-action-btn"
          [class.is-active]="watchlistService.isInWatchlist(movie().id)"
          (click)="onToggleWatchlist($event)"
          [title]="watchlistService.isInWatchlist(movie().id) ? 'Remove from watchlist' : 'Add to watchlist'"
          [attr.aria-label]="watchlistService.isInWatchlist(movie().id) ? 'Remove from watchlist' : 'Add to watchlist'"
        >
          <svg viewBox="0 0 24 24" [attr.fill]="watchlistService.isInWatchlist(movie().id) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" class="action-icon">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>

        <button
          type="button"
          class="card-action-btn"
          [class.is-active]="watchlistService.isWatched(movie().id)"
          (click)="onToggleWatched($event)"
          [title]="watchlistService.isWatched(movie().id) ? 'Watched' : 'Mark as watched'"
          [attr.aria-label]="watchlistService.isWatched(movie().id) ? 'Watched' : 'Mark as watched'"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" class="action-icon">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>

        <button
          type="button"
          class="card-action-btn"
          [class.is-active]="watchlistService.isFavorite(movie().id)"
          (click)="onToggleFavorite($event)"
          [title]="watchlistService.isFavorite(movie().id) ? 'Favorited' : 'Favorite'"
          [attr.aria-label]="watchlistService.isFavorite(movie().id) ? 'Remove favorite' : 'Favorite'"
        >
          <svg viewBox="0 0 24 24" [attr.fill]="watchlistService.isFavorite(movie().id) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" class="action-icon">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>

        <button
          type="button"
          class="card-action-btn"
          [class.is-active]="!!watchlistService.getReviewForMovie(movie().id)"
          (click)="onReviewClick($event)"
          title="Write a review"
          aria-label="Write a review"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="action-icon">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="card-details">
      <h4 class="movie-title" [title]="movie().title">{{ movie().title }}</h4>
      <div class="card-meta-line">
        <span>{{ releaseYear }}</span>
        @if (movie().runtime) {
          <span class="dot-sep"></span>
          <span>{{ movie().runtime }} min</span>
        }
      </div>
    </div>
  </a>
</div>
